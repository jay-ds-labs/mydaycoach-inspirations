name: Enrich and review existing inspirations
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of existing inspirations to enrich in this run (1-20)"
        required: true
        default: "10"
        type: choice
        options: ["5","10","15","20"]
      retry_review:
        description: "Retry articles flagged for review rather than processing new articles"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: inspiration-generation
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Configure commit identity
        run: |
          git config user.name "MyDayCoach Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
      - name: Validate pipeline and image license gates
        run: |
          python3 -m py_compile scripts/enrich_library.py scripts/image_audit.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Enrich existing entries and run independent editorial review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CONTENT_MODEL: gpt-4.1
          OPENAI_REVIEW_MODEL: gpt-4.1
          ENRICH_BATCH_SIZE: ${{ inputs.batch_size }}
          ENRICH_RETRY_REVIEW: ${{ inputs.retry_review }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
          python3 scripts/enrich_library.py
