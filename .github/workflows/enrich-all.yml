name: Enrich entire existing inspiration library
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inspiration-generation
  cancel-in-progress: false
jobs:
  enrich-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure commit identity
        run: |
          git config user.name "MyDayCoach Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
      - name: Validate pipeline
        run: |
          python3 -m py_compile scripts/api_resilience.py scripts/enrich_library.py scripts/audit_images.py scripts/research.py scripts/publication_gate.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Enrich each unreviewed item once, in batches of 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CONTENT_MODEL: gpt-4.1
          OPENAI_REVIEW_MODEL: gpt-4.1
          ENRICH_BATCH_SIZE: "20"
          ENRICH_RETRY_REVIEW: "false"
          ENRICH_MAX_ATTEMPTS: "3"
          CONTENT_TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          for batch in range(1,11):
              data=json.loads(Path("library.json").read_text())
              reviews=json.loads(Path("enrichment-review.json").read_text()).get("items",{})
              pending=[x for x in data["items"] if x.get("status")!="published" and
                  reviews.get(x["id"],{}).get("state") not in
                  ("approved","review_failed","needs_manual_review","review_pending_retry")]
              if not pending:
                  print("No unreviewed items remain. Non-approved items remain blocked.",flush=True)
                  break
              print(f"Batch {batch}: {len(pending)} unreviewed entries",flush=True)
              subprocess.run([sys.executable,"scripts/enrich_library.py"],check=True)
          else:
              raise RuntimeError("Reached safety limit of 10 batches")
          PY
      - name: Report outcomes without publishing failed reviews
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open("enrichment-review.json"))
          counts={}
          for review in data.get("items",{}).values():
              state=review.get("state","unknown")
              counts[state]=counts.get(state,0)+1
          print("Review outcomes:",counts)
          PY
