name: Recover failed inspirations from requested batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [recovery/latest-batch-request.json]
permissions:
  contents: write
concurrency:
  group: inspiration-generation
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check regression tests before recovery
        run: python -m unittest discover -s tests -v
      - name: Configure commit identity
        run: |
          git config user.name "MyDayCoach Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
      - name: Recover failed slots and preserve accepted content
        env:
          INSPIRE_WORKER_URL: ${{ vars.INSPIRE_WORKER_URL }}
          INSPIRE_WORKER_TOKEN: ${{ secrets.INSPIRE_WORKER_TOKEN }}
        run: python scripts/recover_latest_batch.py
