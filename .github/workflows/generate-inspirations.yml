name: Generate and review inspiration batch
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspiration-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure commit identity
        run: |
          git config user.name "MyDayCoach Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
      - name: Generate and review 15 inspirations
        env:
          INSPIRE_WORKER_URL: ${{ vars.INSPIRE_WORKER_URL }}
          INSPIRE_WORKER_TOKEN: ${{ secrets.INSPIRE_WORKER_TOKEN }}
        run: |
          test -n "$INSPIRE_WORKER_URL" && test -n "$INSPIRE_WORKER_TOKEN" || { echo "Missing Inspire Worker URL/token"; exit 1; }
          python3 scripts/generate_batch.py

