name: Generate inspiration draft batch
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspiration-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure commit identity
        run: |
          git config user.name "MyDayCoach Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
      - name: Generate 15 draft candidates and persist progress
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CONTENT_MODEL: gpt-4.1
          CONTENT_TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY secret"; exit 1; }
          python3 scripts/generate_batch.py
      - name: Editorially review the 15 newly generated drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CONTENT_MODEL: gpt-4.1
          OPENAI_REVIEW_MODEL: gpt-4.1
          ENRICH_BATCH_SIZE: "15"
          ENRICH_TARGET_IDS_FILE: refresh-status.json
          ENRICH_MAX_ATTEMPTS: "3"
          CONTENT_TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python3 scripts/enrich_library.py
          python3 scripts/publication_gate.py
          python3 scripts/finalize_refresh.py
          git add refresh-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize refresh editorial outcomes"
            git push origin "HEAD:${CONTENT_TARGET_BRANCH}"
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("enrichment-status.json"))
          print("Editorial review completed:",data.get("approved"),"approved;",data.get("needsReview"),"not approved")
          PY
      - name: Clear stuck refresh status on failure
        if: failure()
        env:
          CONTENT_TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python3 scripts/fail_refresh.py
          git add refresh-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record interrupted refresh for safe retry"
            git push origin "HEAD:${CONTENT_TARGET_BRANCH}"
          fi
