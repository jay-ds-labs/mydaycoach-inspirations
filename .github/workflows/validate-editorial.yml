name: Validate editorial pipeline
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile scripts
        run: python3 -m compileall -q scripts
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
